<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoraWorld · Live VR teleoperation</title>
<style>
:root {
  color-scheme: dark;
  --page: #0b0d10; --surface: #14171c; --line: #262b33; --white: #eceef1; --muted: #9aa1ac;
  --accent: #a582ff; --accent-soft: #c9b5ff; --live: #ff6b6b;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --heading: "Space Grotesk", Inter, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--white); background: var(--page); font: 15px/1.5 Inter, system-ui, sans-serif; }
main { padding: 0 0 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Collections */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs { display: inline-grid; grid-auto-flow: column; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 22px; background: #0e1014; }
.tabs button { min-height: 34px; padding: 0 16px; border: 0; border-radius: 18px; background: none; color: #a8adb6; font-size: 13px; font-weight: 500; white-space: nowrap; }
.tabs button[aria-pressed="true"] { background: #2d2440; color: #ece2ff; box-shadow: inset 0 0 0 1px #5a4778; }
.tabs button:not([aria-pressed="true"]):hover { color: #e5e8ec; }
.caption { margin: 0; color: var(--muted); font-size: 13.5px; }

/* Stage: picture in picture. The operator fills the frame, the generated view floats in the corner; click it to swap. */
.stage { --pw: 30%; --ph: calc(var(--pw) * 2.25 / 1.7333); --gap: 14px; position: relative; aspect-ratio: 2.25; border-radius: 14px; background: var(--surface); }
.frame { position: absolute; overflow: hidden; background: #111418; transition: left .55s cubic-bezier(.2,.8,.2,1), top .55s cubic-bezier(.2,.8,.2,1), width .55s cubic-bezier(.2,.8,.2,1), height .55s cubic-bezier(.2,.8,.2,1), border-radius .55s, box-shadow .3s; }
.frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .35s, transform .55s; }
.frame.loading video { opacity: .7; }
.frame.main { z-index: 1; left: 0; top: 0; width: 100%; height: 100%; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); }
.frame.pip { z-index: 3; left: var(--gap); top: calc(100% - var(--ph) - var(--gap)); width: var(--pw); height: var(--ph); border-radius: 10px; cursor: pointer; box-shadow: 0 0 0 1px rgb(255 255 255 / 20%), 0 16px 40px rgb(0 0 0 / 65%); }
.frame.pip:hover, .frame.pip:focus-visible { box-shadow: 0 0 0 2px var(--accent), 0 16px 40px rgb(0 0 0 / 65%); outline: none; }
.frame.pip::after { content: "⇄"; position: absolute; z-index: 2; right: 6px; top: 6px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: rgb(10 12 15 / 75%); color: #fff; font-size: 12px; opacity: 0; transition: opacity .2s; }
.frame.pip:hover::after, .frame.pip:focus-visible::after { opacity: 1; }
.operator.main video { object-position: var(--focus, 50% 10%); transform: scale(1.06); transform-origin: var(--focus, 50% 20%); }
.chip { position: absolute; z-index: 2; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 7px; padding: 5px 9px; border-radius: 6px; background: rgb(10 12 15 / 78%); backdrop-filter: blur(6px); color: #eef0f3; font: 500 11px/1.2 var(--mono); letter-spacing: .04em; white-space: nowrap; transition: font-size .3s; }
.pip .chip { top: 6px; left: 6px; padding: 3px 6px; font-size: 9.5px; }
.generated .chip { color: var(--accent-soft); }
.chip.rate { left: auto; right: 10px; gap: 6px; color: #fff; background: rgb(45 36 64 / 85%); box-shadow: inset 0 0 0 1px rgb(165 130 255 / 45%); font-weight: 600; }
.chip.rate small { color: #b9a6e0; font-weight: 500; font-size: .85em; letter-spacing: .06em; text-transform: uppercase; }
.pip .chip.rate { left: auto; right: 6px; }
.frame.pip::after { top: auto; bottom: 6px; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: live 1.6s ease-out infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgb(255 107 107 / 60%); } 70%, 100% { box-shadow: 0 0 0 7px rgb(255 107 107 / 0%); } }
.clock { z-index: 4; left: auto; right: 10px; font-variant-numeric: tabular-nums; color: #d9ccff; }
.clock[hidden] { display: none; }
.pause { position: absolute; z-index: 4; right: 12px; bottom: 12px; display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgb(10 12 15 / 70%); backdrop-filter: blur(6px); color: #eef0f3; opacity: .7; transition: opacity .2s; }
.pause:hover, .pause:focus-visible { opacity: 1; }
.pause i { width: 9px; height: 10px; background: linear-gradient(90deg, currentColor 0 32%, transparent 32% 68%, currentColor 68%); }
.pause[data-paused="true"] i { width: 11px; height: 12px; background: currentColor; clip-path: polygon(18% 4%, 96% 50%, 18% 96%); }
.variants { position: absolute; z-index: 4; top: 10px; right: 10px; display: flex; gap: 2px; padding: 2px; border-radius: 15px; background: rgb(10 12 15 / 75%); backdrop-filter: blur(6px); }
.variants[hidden] { display: none; }
.variants button { min-height: 26px; padding: 0 11px; border: 0; border-radius: 13px; background: none; color: #a8adb6; font-size: 12px; }
.variants button[aria-pressed="true"] { background: #2d2440; color: #ece2ff; }

/* Film strip: keeps drifting, so the collection reads as open-ended */
.strip { position: relative; margin-top: 12px; overflow: hidden; -webkit-mask: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.reel { display: flex; gap: 8px; width: max-content; padding: 3px 0; animation: drift var(--dur, 60s) linear infinite; }
.strip:hover .reel, .strip:focus-within .reel { animation-play-state: paused; }
@keyframes drift { to { transform: translateX(calc(-50% - 4px)); } }
.clip { position: relative; flex: none; width: 128px; aspect-ratio: 1.6; padding: 0; overflow: hidden; border: 0; border-radius: 8px; background: var(--surface); opacity: .6; transition: opacity .25s, box-shadow .25s; box-shadow: inset 0 0 0 1px var(--line); }
.clip img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s; }
.clip:hover { opacity: 1; }
.clip:hover img { transform: scale(1.07); }
.clip[aria-current="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--accent); }
.strip.still { -webkit-mask: none; mask: none; }
.strip.still .reel { animation: none; width: auto; }
.strip.still .clip { width: 180px; }

#status { margin: 6px 0 0; color: #e7c9bb; font-size: 13px; }
#status:empty { display: none; }

@media (max-width: 860px) {
  .stage { --pw: 38%; --ph: calc(var(--pw) * 1.6 / 1.7333); --gap: 10px; aspect-ratio: 1.6; }
}
@media (max-width: 560px) {
  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
  .tabs button { min-height: 40px; padding: 4px 6px; font-size: 12px; line-height: 1.2; white-space: normal; }
  .stage { --pw: 44%; --gap: 8px; }
  .chip { top: 6px; left: 6px; padding: 3px 6px; font-size: 9.5px; }
  .pip .chip:not(.rate) { display: none; }
  .chip.rate small { display: none; }
  .clock { left: auto; right: 6px; }
  .variants { top: 6px; right: 6px; }
  .variants button { min-height: 22px; padding: 0 8px; font-size: 11px; }
  .pause { right: 8px; bottom: 8px; width: 28px; height: 28px; }
  .clip { width: 104px; }
  .strip.still .clip { width: calc(50% - 4px); }
}
@media (prefers-reduced-motion: reduce) {
  .chip i { animation: none; }
  .reel { animation: none; } .strip { overflow-x: auto; }
}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="tabs" role="group" aria-label="Collections">
      <button type="button" data-group="novel" aria-pressed="true">Novel scenes</button>
      <button type="button" data-group="robot" aria-pressed="false">Robot manipulation</button>
      <button type="button" data-group="long" aria-pressed="false">Long rollouts</button>
    </div>
    <p class="caption" id="caption"></p>
  </div>

  <section class="stage" aria-label="Synchronized VR teleoperation recording">
    <div class="frame operator main">
      <video id="operator" playsinline muted preload="metadata" aria-label="The VR operator"></video>
      <span class="chip"><i aria-hidden="true"></i>VR operator · live</span>
    </div>
    <div class="frame generated pip" role="button" tabindex="0" aria-label="Swap the two views">
      <video id="generated" playsinline muted preload="metadata" aria-label="What MoraWorld generates for the operator"></video>
      <span class="chip">MoraWorld · generated</span>
      <span class="chip rate" title="17 frames denoised and decoded in 262 ms (median)">15 ms / frame<small>inference</small></span>
    </div>
    <span class="chip clock" id="clock" hidden>00:00 / 10:00</span>
    <div class="variants" role="group" aria-label="Embodiment" hidden>
      <button type="button" data-variant="human">Hands</button>
      <button type="button" data-variant="robot">Robot arms</button>
    </div>
    <button class="pause" id="pause" type="button" aria-label="Pause" data-paused="false"><i aria-hidden="true"></i></button>
  </section>

  <div class="strip" role="group" aria-label="More recordings"><div class="reel"></div></div>
  <p id="status" role="status"></p>

</main>
<script>
// Order matters: the crispest generations lead, softer ones sit at the end.
const groups = {
  novel: ['novel/wukong', 'novel/driving', 'novel/doudizhu', 'novel/eggs', 'novel/tug', 'classroom', 'conference',
          'novel/cake', 'novel/pool', 'novel/blanket', 'titanic', 'castle', 'tokyo', 'novel/lipstick', 'novel/pet-cat', 'novel/door'],
  robot: ['robot/toaster', 'robot/packing', 'robot/laundry', 'robot/washer', 'robot/name-card', 'robot/storage', 'robot/checkout',
          'robot/hang-shirt', 'robot/fridge', 'robot/fold-shirt', 'robot/shoelaces'],
  long: ['long/coastal-boardwalk-10min', 'long/case318-232008-10min']
};
// Where to anchor the operator crop when the default (upper body, standing) misses the person.
const focus = { 'long/coastal-boardwalk-10min': '50% 80%' };
const names = { 'long/coastal-boardwalk-10min': 'Coastal boardwalk', 'long/case318-232008-10min': 'Tabletop manipulation' };
const captions = {
  novel: 'Step into a generated scene and act in it from a VR headset.',
  robot: 'Each rollout starts from a frame of a robot dataset; the operator drives the arms.',
  long: 'Ten minutes of continuous generation, played back faster.'
};
const paired = new Set(['novel/lipstick', 'novel/blanket', 'novel/eggs', 'novel/pool', 'novel/doudizhu']);
const choices = new Map();
const variantFor = key => choices.get(key) || (key === 'novel/lipstick' ? 'robot' : 'human');
const stem = key => paired.has(key) ? key + '-' + variantFor(key) : key;
const label = key => names[key] || key.split('/').pop().replace(/-/g, ' ');

const $ = s => document.querySelector(s);
const generated = $('#generated'), operator = $('#operator'), videos = [generated, operator];
const pause = $('#pause'), clock = $('#clock'), status = $('#status');
const strip = $('.strip'), reel = $('.reel'), variants = $('.variants'), tabs = [...document.querySelectorAll('.tabs button')];
const frames = [...document.querySelectorAll('.stage .frame')];
function swap() {
  frames.forEach(f => {
    const nowMain = f.classList.contains('pip');
    f.classList.toggle('main', nowMain); f.classList.toggle('pip', !nowMain);
    if (nowMain) { f.removeAttribute('role'); f.removeAttribute('tabindex'); f.removeAttribute('aria-label'); }
    else { f.setAttribute('role', 'button'); f.tabIndex = 0; f.setAttribute('aria-label', 'Swap the two views'); }
  });
}
frames.forEach(f => {
  f.addEventListener('click', () => { if (f.classList.contains('pip')) swap(); });
  f.addEventListener('keydown', e => { if (f.classList.contains('pip') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); swap(); } });
});
let group = new URLSearchParams(location.search).get('section');
if (group === 'roaming') group = 'novel';
if (!groups[group]) group = 'novel';
let current = null, request = 0;
let autoplay = !matchMedia('(prefers-reduced-motion: reduce)').matches;
let hostVisible = window === parent;

const pad = s => { s = Math.floor(Math.max(0, s || 0)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const end = () => Math.min(generated.duration, operator.duration);
// Long rollouts always play at 16× so the full ten minutes reads in under a minute.
const rate = () => group === 'long' ? 16 : 1;
function showPaused(paused) { pause.dataset.paused = String(paused); pause.setAttribute('aria-label', paused ? 'Play' : 'Pause'); }
function pauseBoth() { request++; videos.forEach(v => v.pause()); showPaused(true); }
async function start() {
  if (!autoplay || !hostVisible || document.hidden) return;
  if (Number.isFinite(generated.duration)) operator.currentTime = generated.currentTime;
  const mine = ++request;
  status.textContent = '';
  showPaused(false);
  try { await Promise.all(videos.map(v => v.play())); }
  catch (error) {
    if (mine !== request || error.name === 'AbortError') return;
    autoplay = false; pauseBoth(); status.textContent = 'Playback could not start. Press play to try again.';
  }
}
function update() {
  if (!videos.every(v => Number.isFinite(v.duration))) return;
  const at = Math.min(generated.currentTime, end()), r = rate(at);
  videos.forEach(v => { if (v.playbackRate !== r) v.playbackRate = r; });
  if (group === 'long') clock.textContent = pad(at) + ' / ' + pad(end()) + (r > 1 ? ' · ' + r + '×' : '');
}

function markCurrent() {
  reel.querySelectorAll('.clip').forEach(c => c.setAttribute('aria-current', String(c.dataset.key === current)));
}
function load(key) {
  current = key;
  pauseBoth();
  markCurrent();
  variants.hidden = !paired.has(key);
  variants.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.variant === variantFor(key))));
  const base = stem(key);
  operator.parentElement.style.setProperty('--focus', focus[key] || '50% 10%');
  frames.forEach(f => f.classList.add('loading'));
  for (const v of videos) { v.poster = base + '-' + v.id + '.jpg'; v.src = base + '-' + v.id + '.mp4'; v.load(); }
  start();
}
function clipButton(key, copy) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'clip'; b.dataset.key = key;
  b.setAttribute('aria-label', label(key));
  if (copy) { b.tabIndex = -1; b.setAttribute('aria-hidden', 'true'); }
  const img = document.createElement('img'); img.alt = ''; img.loading = 'lazy'; img.src = stem(key) + '-generated.jpg';
  b.append(img);
  b.addEventListener('click', () => { autoplay = true; if (current !== key) load(key); else start(); });
  return b;
}
function show(name) {
  group = name;
  tabs.forEach(t => t.setAttribute('aria-pressed', String(t.dataset.group === name)));
  $('#caption').textContent = captions[name];
  clock.hidden = name !== 'long';
  const keys = groups[name], still = keys.length < 4;
  strip.classList.toggle('still', still);
  // The reel holds the list twice so the drift can loop without a seam.
  reel.replaceChildren(...keys.map(k => clipButton(k, false)), ...(still ? [] : keys.map(k => clipButton(k, true))));
  reel.style.setProperty('--dur', keys.length * 4.5 + 's');
  load(keys[0]);
}
function advance() {
  const keys = groups[group];
  load(keys[(keys.indexOf(current) + 1) % keys.length]);
}

tabs.forEach(t => t.addEventListener('click', () => { if (t.dataset.group !== group) { autoplay = true; show(t.dataset.group); } }));
variants.addEventListener('click', e => {
  const b = e.target.closest('button[data-variant]');
  if (!b || b.dataset.variant === variantFor(current)) return;
  choices.set(current, b.dataset.variant);
  reel.querySelectorAll(`[data-key="${current}"] img`).forEach(img => { img.src = stem(current) + '-generated.jpg'; });
  load(current);
});
pause.addEventListener('click', () => { if (generated.paused) { autoplay = true; start(); } else { autoplay = false; pauseBoth(); } });
generated.addEventListener('timeupdate', () => {
  update();
  const tolerance = Math.max(.12, generated.playbackRate * .075);
  if (!generated.paused && !operator.seeking && Math.abs(operator.currentTime - generated.currentTime) > tolerance) operator.currentTime = generated.currentTime;
});
// Short clips flow straight into the next one; long rollouts loop on themselves.
generated.addEventListener('ended', () => {
  if (group === 'long') { videos.forEach(v => { v.currentTime = 0; }); start(); }
  else advance();
});
for (const event of ['playing', 'loadeddata']) generated.addEventListener(event, () => frames.forEach(f => f.classList.remove('loading')));
videos.forEach(v => {
  v.addEventListener('loadedmetadata', update);
  v.addEventListener('error', () => { if (v.getAttribute('src')) { pauseBoth(); status.textContent = 'This video could not load.'; } });
});
function syncVisibility() { if (!hostVisible || document.hidden) pauseBoth(); else if (autoplay && generated.paused) start(); }
document.addEventListener('visibilitychange', syncVisibility);
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== parent || e.data?.type !== 'teleop-visible') return;
  hostVisible = e.data.visible; syncVisibility();
});
show(group);
</script>
</body>
</html>
