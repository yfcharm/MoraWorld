 <rect x="560" y="460" width="530" height="143" rx="10" fill="#17141F" stroke="#47374F"/>
 <text x="578" y="485" class="mono">MEMORY LORA / INDEPENDENT WEIGHT INCREMENT</text>
 <text x="578" y="522" style="font-size:21px;fill:#E1D3EE">W = W<tspan baseline-shift="sub" font-size="12">parent</tspan><tspan baseline-shift="baseline"> + </tspan><tspan fill="#BE99F1">ΔW</tspan><tspan baseline-shift="sub" font-size="12" fill="#BE99F1">Memory</tspan></text>
 <text x="578" y="553" class="small">Applied to native Q / K / V / O and FFN projections</text><text x="578" y="579" class="small">Parent stays frozen during Memory training</text>
