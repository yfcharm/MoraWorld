<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
 <title id="title">Memory: retrieve the view, condition the next chunk</title>
 <desc id="desc">Past visual latent patches and camera poses form a memory bank. Query camera frusta retrieve relevant past frames outside the recent context window. Their image tokens are packed beside recent context and the current noisy chunk. H3 masked attention lets current queries read memory keys and values, while memory cannot read the current target. A separate Memory LoRA adds weight updates to native Q, K, V, O and feed-forward projections. The next latent chunk is decoded to RGB. Completed generated chunks can be appended in online-bank mode.</desc>
 <defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17141F"/><stop offset="1" stop-color="#0C1117"/></linearGradient>
  <linearGradient id="memory" x2="1" y2="1"><stop stop-color="#A582FF" stop-opacity=".2"/><stop offset="1" stop-color="#A582FF" stop-opacity=".035"/></linearGradient>
  <linearGradient id="current" x2="1" y2="1"><stop stop-color="#6CCAB0" stop-opacity=".15"/><stop offset="1" stop-color="#6CCAB0" stop-opacity=".025"/></linearGradient>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#B69CD6" stroke-width="1.3"/></marker>
  <marker id="green-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#7BB6A7" stroke-width="1.3"/></marker>
  <pattern id="patches" width="11" height="11" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="8" height="8" rx="1" fill="#BFA0F0" opacity=".55"/></pattern>
 </defs>
 <style>text{font-family:Inter,Arial,sans-serif;fill:#D6CDDF;font-size:14px}.small{font-size:12px;fill:#8F879C}.mono{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:1.6px;fill:#A78ABC}.heading{font-size:20px;font-weight:500;fill:#E5DBEF}.purple{fill:#C8A9F2}.green{fill:#93CEBC}.wire{fill:none;stroke:#9D7CC1;stroke-width:1.5;marker-end:url(#arrow)}</style>
 <rect width="1120" height="650" rx="16" fill="url(#bg)"/>
 <text x="30" y="34" class="mono">MEMORY / MODEL ARCHITECTURE</text>
 <text x="30" y="70" style="font-size:27px;letter-spacing:-.5px">Retrieve the view. Condition the next chunk.</text>
 <text x="1090" y="35" text-anchor="end" class="mono">PAST → PRESENT</text>
 <path d="M30 91H1090" stroke="#302B3A"/>

 <text x="30" y="122" class="mono">01 / STORE</text><text x="300" y="122" class="mono">02 / RETRIEVE</text><text x="580" y="122" class="mono">03 / READ WITH ATTENTION</text>
 <rect x="30" y="140" width="228" height="241" rx="10" fill="#141820" stroke="#353440"/>
 <text x="48" y="168" class="heading">Past-only bank</text><text x="48" y="190" class="small">Visual latents + camera poses</text>
