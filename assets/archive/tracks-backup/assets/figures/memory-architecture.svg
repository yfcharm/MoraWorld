 <g fill="url(#patches)"><rect x="54" y="218" width="36" height="44"/><rect x="108" y="218" width="36" height="44"/><rect x="162" y="218" width="36" height="44"/></g>
 <rect x="102" y="210" width="48" height="62" rx="4" fill="url(#memory)" stroke="#BE98ED" stroke-width="1.6"/>
 <g fill="none" stroke="#8E769F" stroke-width="1.2"><path d="M61 292L81 282V303ZM81 282L91 288V309L81 303M81 282L91 288"/><path d="M114 292L134 282V303ZM134 282L144 288V309L134 303M134 282L144 288"/><path d="M168 292L188 282V303ZM188 282L198 288V309L188 303M188 282L198 288"/></g>
 <text x="48" y="339" class="small">Older than the recent window</text><text x="48" y="360" class="small">Each entry keeps its own pose</text>

