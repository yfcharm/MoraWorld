  <text x="637" y="207" text-anchor="middle" class="small">Conditions</text><text x="738" y="207" text-anchor="middle" class="purple">Memory tokens</text><text x="858" y="207" text-anchor="middle">Recent context</text><text x="996" y="207" text-anchor="middle" class="green">Current noisy chunk</text></g>
 <path d="M738 220V235H794V246M858 220V246M996 220V235H921V246" fill="none" stroke="#8E739F" stroke-width="1.3"/>
 <text x="780" y="243" text-anchor="end" class="small">K / V</text><text x="939" y="243" class="small">Q</text>
 <rect x="668" y="250" width="335" height="42" rx="6" fill="#231C30" stroke="#A582FF"/><text x="835" y="276" text-anchor="middle">Masked self-attention</text>
